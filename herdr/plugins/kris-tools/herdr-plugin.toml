id = "kris.tools"
name = "Kris tools"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Personal panes: lazygit in a tab, worktree setup hook, project colours"
platforms = ["macos"]

[[panes]]
id = "lazygit"
title = "git"
placement = "tab"
# If lazygit crashes, keep the tab open long enough to read why
command = ["/bin/zsh", "-c", "/opt/homebrew/bin/lazygit || { echo; echo 'lazygit exited with an error. Press any key to close.'; read -k1 }"]

# New worktree: run ~/.config/herdr/worktree-setup/<repo>.sh + agent, add a lazygit tab
[[events]]
on = "worktree.created"
command = ["/bin/sh", "-c", "exec /bin/sh \"$HOME/.config/herdr/scripts/worktree-created.sh\""]

# Project colours (scripts/worktree-theme.py): regenerate herdr's config for the focused workspace
[[events]]
on = "workspace.focused"
command = ["/bin/sh", "-c", "PATH=\"$HOME/.local/bin:/opt/homebrew/bin:$PATH\" exec \"$HOME/.config/herdr/scripts/worktree-theme.py\""]

[[startup]]
command = ["/bin/sh", "-c", "PATH=\"$HOME/.local/bin:/opt/homebrew/bin:$PATH\" exec \"$HOME/.config/herdr/scripts/worktree-theme.py\""]
